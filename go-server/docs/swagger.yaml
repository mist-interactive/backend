definitions:
  handlers.LoginRequest:
    properties:
      password:
        maxLength: 72
        minLength: 8
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  handlers.MatchInput:
    properties:
      player_one:
        type: integer
      player_two:
        type: integer
      result:
        enum:
        - player1_win
        - player2_win
        - draw
        - aborted
        type: string
      started_at:
        type: string
    required:
    - player_one
    - player_two
    - result
    - started_at
    type: object
  handlers.ProfileResponse:
    properties:
      avatar_url:
        type: string
      email:
        type: string
      id:
        type: integer
      total_losses:
        type: integer
      total_wins:
        type: integer
      username:
        type: string
    type: object
  handlers.RegisterRequest:
    properties:
      email:
        maxLength: 255
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  handlers.UpdateProfileInput:
    properties:
      email:
        type: string
      username:
        type: string
    type: object
  models.MatchRecord:
    properties:
      finished_at:
        type: string
      id:
        type: integer
      player_one:
        type: integer
      player_two:
        type: integer
      result:
        type: string
      started_at:
        type: string
    type: object
  models.User:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      total_losses:
        type: integer
      total_wins:
        type: integer
      username:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/internal/match-history:
    post:
      consumes:
      - application/json
      description: Submit an official game completion record. Executes an atomic database
        transaction that logs the match history and increments player profile win/loss
        counts.
      parameters:
      - description: Server API Key Authentication
        in: header
        name: X-API-Key
        required: true
        type: string
      - description: Match Result Details
        in: body
        name: match
        required: true
        schema:
          $ref: '#/definitions/handlers.MatchInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.MatchRecord'
        "400":
          description: Invalid JSON payload or validation failure
          schema:
            type: string
        "500":
          description: Internal Server Error - Database transaction failure
          schema:
            type: string
      summary: Record Game Match History
      tags:
      - matches
  /api/login:
    post:
      consumes:
      - application/json
      description: Authenticate user credentials via username and password. On success,
        sets a secure HttpOnly session cookie.
      parameters:
      - description: Login Credentials
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: '{"message": "Login successful"}'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid JSON payload or validation failure
          schema:
            type: string
        "403":
          description: Forbidden - Incorrect password
          schema:
            type: string
        "404":
          description: User not found
          schema:
            type: string
        "500":
          description: Internal Server Error - Session generation failed
          schema:
            type: string
      summary: User Login
      tags:
      - auth
  /api/match-history:
    get:
      description: Retrieve a chronologically sorted list (newest first) of all match
        history records involving the authenticated player.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.MatchRecord'
            type: array
        "500":
          description: Internal Server Error - Context missing or database read failure
          schema:
            type: string
      security:
      - CookieAuth: []
      summary: Get Player Match History
      tags:
      - matches
  /api/profile:
    get:
      description: Fetch profile parameters, statistics (wins/losses), and metadata
        for the current authenticated user session.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ProfileResponse'
        "500":
          description: Internal Server Error - Context missing user state
          schema:
            type: string
      security:
      - CookieAuth: []
      summary: Get Player Profile
      tags:
      - profile
    patch:
      consumes:
      - application/json
      description: Perform partial updates (PATCH style validation) on specific authorized
        profile parameters like username or email.
      parameters:
      - description: Updatable Profile Properties
        in: body
        name: profile
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateProfileInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Invalid JSON payload, validation breach, or empty field mismatch
          schema:
            type: string
        "500":
          description: Internal Server Error - Database unique constraint or persistence
            failure
          schema:
            type: string
      security:
      - CookieAuth: []
      summary: Update Player Profile Fields
      tags:
      - profile
  /api/register:
    post:
      consumes:
      - application/json
      description: Create a new user account profile. Automatically hashes user passwords
        using bcrypt and stores emails in lowercase.
      parameters:
      - description: Registration Form Data
        in: body
        name: register
        required: true
        schema:
          $ref: '#/definitions/handlers.RegisterRequest'
      responses:
        "201":
          description: Account created successfully
        "400":
          description: Invalid input layout or validation constraints failed (username_safety/password_complexity)
          schema:
            type: string
        "409":
          description: Conflict - Username or Email already registered
          schema:
            type: string
        "500":
          description: Internal Server Error - Database writing failure
          schema:
            type: string
      summary: Register New User Account
      tags:
      - auth
  /api/renew:
    post:
      description: Generates a short-lived RS256 cryptographically signed access JWT
        using the authenticated cookie session data for validation.
      produces:
      - application/json
      responses:
        "200":
          description: '{"token": "ey..."}'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'Internal server error: Token signing failed or session missing'
          schema:
            type: string
      security:
      - CookieAuth: []
      summary: Issue Short-Lived JWT Token
      tags:
      - auth
swagger: "2.0"
