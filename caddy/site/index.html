<!doctype html>
// generated by Gemini Flash 3.5
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transcendence Dev Sandbox</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 450px;
        margin: 40px auto;
        padding: 0 20px;
        background: #1a1a1a;
        color: #e0e0e0;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 24px;
        padding: 20px;
        background: #2a2a2a;
        border-radius: 8px;
        border: 1px solid #3a3a3a;
      }
      input,
      button {
        padding: 10px;
        border-radius: 4px;
        border: 1px solid #444;
        background: #333;
        color: #fff;
        font-size: 14px;
      }
      button {
        background: #0066cc;
        color: white;
        cursor: pointer;
        border: none;
        font-weight: bold;
      }
      button:hover {
        background: #0052a3;
      }
      .console {
        background: #000;
        color: #00ff00;
        padding: 15px;
        border-radius: 6px;
        font-family: monospace;
        font-size: 13px;
        white-space: pre-wrap;
        overflow-x: auto;
        border: 1px solid #222;
      }
    </style>
  </head>
  <body>
    <h1>ft_transcendence Auth Test</h1>
    <p>Testing connection via Caddy Gateway</p>
    <h2>Register</h2>
    <form id="registerForm">
      <input type="text" id="regUser" placeholder="Username" required />
      <input type="email" id="regEmail" placeholder="Email" required />
      <input type="password" id="regPass" placeholder="password" required />
      <button type="submit">Submit Registration</button>
    </form>

    <h2>Login</h2>
    <form id="loginForm">
      <input type="text" id="logUser" placeholder="Username" required />
      <input type="password" id="logPass" placeholder="Password" required />
      <button type="submit">Submit Login</button>
    </form>

    <h2>Network Output</h2>
    <div id="output" class="console">No actions performed yet.</div>

    <script>
      const outputDiv = document.getElementById("output");

      function logResult(action, status, data) {
        outputDiv.innerText = `[${new Date().toLocaleTimeString()}] ${action}\nHTTP Status: ${status}\nResponse: ${JSON.stringify(data, null, 2)}`;
      }

      // Handle Registration
      document
        .getElementById("registerForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          try {
            const response = await fetch("/api/register", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                username: document.getElementById("regUser").value,
                email: document.getElementById("regEmail").value,
                password: document.getElementById("regPass").value,
              }),
            });
            const data = await response.json().catch(() => ({}));
            logResult("POST /api/register", response.status, data);
          } catch (err) {
            outputDiv.innerText = `Network Error: ${err.message}`;
          }
        });

      // Handle Login
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          try {
            const response = await fetch("/api/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                username: document.getElementById("logUser").value,
                password: document.getElementById("logPass").value,
              }),
            });
            const data = await response.json().catch(() => ({}));
            logResult("POST /api/login", response.status, data);
          } catch (err) {
            outputDiv.innerText = `Network Error: ${err.message}`;
          }
        });
    </script>

    <button id="renewBtn">Get JWT</button>
    <pre id="tokenOutput">Token will appear here...</pre>
    <script>
      //Test /api/renew
      document
        .getElementById("renewBtn")
        .addEventListener("click", async () => {
          try {
            const response = await fetch("/api/renew", {
              method: "POST",
            });
            if (!response.ok) {
              const errorText = await response.text();
              document.getElementById("tokenOutput").innerText =
                `Error (${response.status}): ${errorText}`;
              return;
            }
            const data = await response.json();
            document.getElementById("tokenOutput").innerText = JSON.stringify(
              data,
              null,
              2,
            );
            console.log("Your JWT:", data.ticket);
          } catch (err) {
            document.getElementById("tokenOutput").innerText =
              `Network Error: ${err.message}`;
          }
        });
    </script>
  </body>
</html>
